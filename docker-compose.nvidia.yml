# Optional add-on: NVIDIA GPU for Plex hardware transcoding (needs Plex Pass)
# and for Tdarr encoding (when the tdarr profile is on).
# Requires the NVIDIA driver and NVIDIA Container Toolkit on the Docker host.
# See README "Hardware transcoding (NVIDIA)".
#   CLI:       make up GPU=nvidia
#   Portainer: paste the merged file from `make gpu-config` as the stack file.

services:
  plex:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tdarr:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
