# ARR Stack - Complete Media Automation
# Configure via .env (copy .env.example) before deploying.
# See README.md for setup and crash-recovery instructions.

# Docker's default json-file logging never rotates, so logs grow until the
# disk fills. Every service uses this: 3 x 10 MB max per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  arr-net:
    # Shared with other stacks (e.g. Homarr, Nginx Proxy Manager), so it lives
    # outside this stack. Create once per host: docker network create arr-net
    external: true

services:

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    logging: *logging
    network_mode: host  # Plex requires host network mode for discovery/DLNA
    # No GPU on this host, so all transcoding is software. Cap it so a busy
    # transcode can't starve the rest of the stack.
    cpus: ${PLEX_CPUS:-3}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VERSION=docker
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/plex:/config
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${TAUTULLI_PORT:-8181}:8181
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/tautulli:/config

  # Seerr is the actively maintained community fork of Overseerr.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${SEERR_PORT:-5055}:5055
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/overseerr:/app/config

  # Automated library cleanup rules (e.g. remove watched/stale media from Plex).
  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:latest
    container_name: maintainerr
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    networks: [arr-net]
    ports:
      - ${MAINTAINERR_PORT:-6246}:6246
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/maintainerr:/opt/data

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${SONARR_PORT:-8989}:8989
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/sonarr:/config
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${RADARR_PORT:-7878}:7878
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/radarr:/config
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${BAZARR_PORT:-6767}:6767
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/bazarr:/config
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/prowlarr:/config

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${JACKETT_PORT:-9117}:9117
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/jackett:/config
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    ports:
      - ${QBITTORRENT_PORT:-8080}:${QBITTORRENT_PORT:-8080}
      - 6881:6881
      - 6881:6881/udp
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=${QBITTORRENT_PORT:-8080}
    volumes:
      - ${APPDATA_PATH:?set APPDATA_PATH in .env}/qbittorrent:/config
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads

  # Auto-extracts compressed downloads (rar/zip) before Sonarr/Radarr import.
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    cpus: ${UNPACKERR_CPUS:-1}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
    volumes:
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads

  # Headless Chrome for Cloudflare-protected indexers; spikes CPU per solve.
  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    container_name: flaresolverr
    restart: unless-stopped
    logging: *logging
    networks: [arr-net]
    cpus: ${FLARESOLVERR_CPUS:-1}
    # Leaks Chromium processes over days (seen: 77 browsers, swap 100% full).
    # The cap makes the kernel kill leaked browsers inside this container
    # instead of pushing the whole host into swap. Swap limit = memory limit,
    # so it can't spill into swap either.
    mem_limit: ${FLARESOLVERR_MEM:-1g}
    memswap_limit: ${FLARESOLVERR_MEM:-1g}
    ports:
      - ${FLARESOLVERR_PORT:-8191}:8191
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
