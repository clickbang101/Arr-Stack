# ARR Stack - Complete Media Automation
# Configure via .env file before deploying
# See README.md for setup instructions

services:

  plex:
    image: lscr.io/linuxserver/plex
    container_name: plex
    network_mode: host  # Plex requires host network mode for proper functionality
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=${PLEX_VERSION}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_PATH}:/media
      - ${APPDATA_PATH}/plex:/config
    healthcheck:
      test: curl -f http://localhost:32400/identity || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_PORT}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${APPDATA_PATH}/qbittorrent:/config
    ports:
      - ${QBITTORRENT_PORT}:${QBITTORRENT_PORT}
      - 6881:6881
      - 6881:6881/udp
    healthcheck:
      test: curl -f http://localhost:${QBITTORRENT_PORT}/api/v2/app/webapiVersion || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${MEDIA_PATH}:/media
      - ${APPDATA_PATH}/sonarr:/config
    ports:
      - ${SONARR_PORT}:8989
    healthcheck:
      test: curl -f http://localhost:8989/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${MEDIA_PATH}:/media
      - ${APPDATA_PATH}/radarr:/config
    ports:
      - ${RADARR_PORT}:7878
    healthcheck:
      test: curl -f http://localhost:7878/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT}:9696
    healthcheck:
      test: curl -f http://localhost:9696/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}

  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_PATH}:/media
      - ${APPDATA_PATH}/bazarr:/config
    ports:
      - ${BAZARR_PORT}:6767
    healthcheck:
      test: curl -f http://localhost:6767/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}

  overseerr:
    image: sctx/overseerr:latest
    container_name: overseerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - ${OVERSEERR_PORT}:5055
    volumes:
      - ${APPDATA_PATH}/overseerr:/app/config
    healthcheck:
      test: curl -f http://localhost:5055/api/v1/settings/main || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: ${RESTART_POLICY}

  jackett:
    image: lscr.io/linuxserver/jackett
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/jackett:/config
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - ${JACKETT_PORT}:9117
    healthcheck:
      test: curl -f http://localhost:9117/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}


  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - ${FLARESOLVERR_PORT}:8191
    environment:
      - LOG_LEVEL=info
    platform: linux/amd64  # or linux/arm64 if you're on ARM
    healthcheck:
      test: curl -f http://localhost:8191/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}



  lazylibrarian:
    image: linuxserver/lazylibrarian
    container_name: lazylibrarian
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOWNLOADS_PATH}:/downloads
      - ${MEDIA_PATH}:/books
      - ${APPDATA_PATH}/lazylibrarian:/config
    ports:
      - ${LAZYLIBRARIAN_PORT}:5299
    healthcheck:
      test: curl -f http://localhost:5299/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY}
