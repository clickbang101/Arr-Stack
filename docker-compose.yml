version: "3.8"

services:

  plex:
    image: lscr.io/linuxserver/plex
    container_name: plex
    network_mode: host 
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - TZ=Africa/Johannesburg
    volumes:
      - /home/supervisor/share/media:/media
      - /home/supervisor/appdata/plex:/config
    ports:
      - 32400:32400
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
      - WEBUI_PORT=8080
    volumes:
      - /home/supervisor/share/downloads:/downloads
      - /home/supervisor/appdata/qbittorrent:/config
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
    volumes:
      - /home/supervisor/share/downloads:/downloads
      - /home/supervisor/share/media:/media
      - /home/supervisor/appdata/sonarr:/config
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
    volumes:
      - /home/supervisor/share/downloads:/downloads
      - /home/supervisor/share/media:/media
      - /home/supervisor/appdata/radarr:/config
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
    volumes:
      - /home/supervisor/appdata/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
    volumes:
      - /home/supervisor/share/media:/media
      - /home/supervisor/appdata/bazarr:/config
    ports:
      - 6767:6767
    restart: unless-stopped

  overseerr:
    image: sctx/overseerr:latest
    container_name: overseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Africa/Johannesburg
    ports:
      - 5055:5055
    volumes:
      - /home/supervisor/appdata/overseerr:/app/config
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
    volumes:
      - /home/supervisor/appdata/jackett:/config
      - /home/supervisor/downloads:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped


  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - 8191:8191
    environment:
      - LOG_LEVEL=info
    platform: linux/amd64  # or linux/arm64 if you're on ARM
    restart: unless-stopped



  lazylibrarian:
    image: linuxserver/lazylibrarian
    container_name: lazylibrarian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Johannesburg
    volumes:
      - /home/supervisor/share/downloads:/downloads
      - /home/supervisor/share/media:/books
      - /home/supervisor/appdata/lazylibrarian:/config
    ports:
      - 5299:5299
    restart: unless-stopped
